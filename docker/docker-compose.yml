services:
  dashboard:
    build: {context: .., dockerfile: docker/Dockerfile.dashboard}
    ports: ["8501:8501"]
    volumes: ["../data/raw:/app/data/raw:ro"]
  api:
    build: {context: .., dockerfile: docker/Dockerfile.api}
    ports: ["8000:8000"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]
volumes: {mlflow: {}}

