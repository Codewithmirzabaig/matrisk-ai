[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrisk-ai"
version = "1.0.0"
description = "Physics-aware material intelligence for financial and infrastructure risk"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3",
  "PyYAML>=6", "streamlit>=1.37", "plotly>=5.22", "fastapi>=0.112",
  "uvicorn>=0.30", "pydantic>=2.8"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]
ml = ["shap>=0.46", "xgboost>=2.1", "mlflow>=2.15", "torch>=2.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

